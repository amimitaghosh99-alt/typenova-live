<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Container -->
  <rect width="100" height="100" rx="24" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />

  <!-- 3D Isometric Keycap Base -->
  <path d="M 12 52 L 50 74 L 50 90 L 12 68 Z" fill="#090d16" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <path d="M 50 74 L 88 52 L 88 68 L 50 90 Z" fill="#030712" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Top Face with Glowing Cyan Stroke -->
  <path d="M 50 14 L 88 36 L 50 58 L 12 36 Z" fill="#0f172a" stroke="url(#cyanBorder)" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Front Highlight Ridge -->
  <path d="M 12 36 L 50 58 L 88 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- High-Contrast Supernova Starburst Center Core -->
  <g transform="translate(50, 36)" filter="url(#glow)">
    <!-- 4-Point Star Core -->
    <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="url(#starCore)" />
    <!-- Center Radiant Diamond -->
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#ffffff" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>
</svg>