    <rect width="20" height="16" x="2" y="4" rx="3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M10 8h.01M12 12h.01M14 8h.01M16 12h.01M18 8h.01M6 8h.01M7 16h10M8 12h.01" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
